spring.application.name=inventario
server.port=8080

# Configuración de base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:inventariodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Crear tablas automáticamente y habilitar consola H2
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

spring.security.user.name=Valentina
spring.security.user.password=1234