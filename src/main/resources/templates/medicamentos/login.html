<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Sistema de Inventario Farmacéutico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body class="login-page">

<div class="d-flex justify-content-center align-items-center min-vh-100">

    <div class="card login-card shadow-sm" style="max-width: 400px; width: 100%;">

        <div class="card-header-pastel p-4 text-center">
            <h4 class="fw-bold mb-1">Farmacia</h4>
            <small class="text-muted">Control de Inventario Medicamentos</small>
        </div>

        <div class="card-body p-4">

            <div th:if="${param.error != null}" class="alert alert-danger mb-3 text-center">
                Usuario o contraseña incorrectos.
            </div>
            
            <div th:if="${param.registro != null}" class="alert alert-success mb-3 text-center">
                Cuenta creada correctamente. Ahora puedes iniciar sesión.
            </div>

            <div th:if="${param.logout != null}" class="alert alert-info mb-3 text-center">
                Sesión cerrada correctamente.
            </div>

            <form th:action="@{/login}" method="post">

                <div class="mb-3">
                    <label for="nombreU" class="form-label fw-semibold">Usuario</label>
                    <input type="text"
                           id="nombreU"
                           name="username"
                           class="form-control"
                           placeholder="Ej. Jungkook"
                           required
                           autofocus>
                </div>

                <div class="mb-3">
                    <label for="contraseña" class="form-label fw-semibold">Contraseña</label>
                    <input type="password"
                           id="contraseña"
                           name="password"
                           class="form-control"
                           placeholder="•••••••"
                           required>
                </div>

                <button type="submit" class="btn btn-pastel-login py-2 w-100">
                    Iniciar Sesión
                </button>

            </form>

            <div class="text-center mt-3">
                <a th:href="@{/registro}" class="btn btn-pastel-register w-100">
                    Crear cuenta
                </a>
            </div>

        </div>

    </div>

</div>

</body>
</html>
