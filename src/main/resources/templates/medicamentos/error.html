<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

    <div class="container text-center">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg p-4 card-error border">
                    <div class="card-body">
                        
                        <span class="badge rounded-pill px-3 py-2 mb-3 badge-codigo-error" th:text="'Error ' + ${codigo}">
                            Error 404
                        </span>
                        
                        <h1 class="display-1 fw-bold text-pastel-title" th:text="${codigo}">404</h1>
                        
                        <p class="fs-5 text-muted my-3" th:text="${mensaje}">
                            La página o recurso que buscas no existe.
                        </p>
                        
                        <div class="mt-4">
                            <a th:href="@{/medicamentos}" class="btn btn-pastel-save btn-lg px-4 shadow-sm">
                                Volver al inicio
                            </a>
                        </div>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
