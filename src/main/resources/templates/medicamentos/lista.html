<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario de Medicamentos</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #f4f7f6; 
            color: #333333;
        }
        h2 {
            color: #4a4e69;
        }
        .btn-pastel-add {
            background-color: #c8e6c9; 
            color: #2e7d32;
            border: none;
            border-radius: 8px;
            font-weight: bold;
        }
        .btn-pastel-add:hover {
            background-color: #a5d6a7;
            color: #1b5e20;
        }
        .table-pastel {
            background-color: #ffffff;
            border-radius: 10px;
            overflow: hidden;
        }
        .table-pastel thead {
            background-color: #d8e2dc; 
            color: #3d5a80;
        }
        .table-pastel tbody tr:nth-child(even) {
            background-color: #f8edeb; 
        }
        .table-pastel tbody tr:hover {
            background-color: #e8e8e4;
        }
    </style>
</head>
<body class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Inventario de Medicamentos</h2>
        <a th:href="@{/medicamentos/nuevo}" class="btn btn-pastel-add px-3 py-2">+ Registrar Medicamento</a>
    </div>

    <div class="table-responsive shadow-sm rounded-3">
        <table class="table table-borderless table-pastel mb-0 align-middle">
            <thead>
                <tr>
                    <th class="py-3">ID</th>
                    <th class="py-3">Nombre</th>
                    <th class="py-3">Laboratorio</th>
                    <th class="py-3">Precio</th>
                    <th class="py-3">Stock</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="med : ${medicamentos}">
                    <td th:text="${med.id}">1</td>
                    <td th:text="${med.nombre}">Acetaminofen</td>
                    <td th:text="${med.laboratorio}">Genfar</td>
                    <td th:text="${'$' + med.precio}">$5000</td>
                    <td th:text="${med.stock}">50</td>
                </tr>
                <tr th:if="${#lists.isEmpty(medicamentos)}">
                    <td colspan="5" class="text-center text-muted py-4">No hay medicamentos registrados en el sistema.</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
