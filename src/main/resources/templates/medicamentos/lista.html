<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario de Medicamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Inventario de Medicamentos</h2>
        <a th:href="@{/medicamentos/nuevo}" class="btn btn-pastel-add px-3 py-2">+ Registrar Medicamento</a>
    </div>

    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <form th:action="@{/medicamentos}" method="get" class="input-group mb-4 shadow-sm rounded-3 overflow-hidden">
        <input type="text" name="keyword" class="form-control form-control-lg fs-6 border-end-0" placeholder="Buscar por nombre de medicamento" th:value="${keyword}">
        <button class="btn btn-pastel-search px-4 border-start-0" type="submit">Buscar</button>
        <a th:href="@{/medicamentos}" class="btn btn-pastel-clear px-3 d-flex align-items-center justify-content-center text-decoration-none">Limpiar</a>
    </form>

    <div class="table-responsive shadow-sm rounded-3">
        <table class="table table-borderless table-pastel mb-0 align-middle">
            <thead>
                <tr>
                    <th class="py-3">ID</th>
                    <th class="py-3">Nombre</th>
                    <th class="py-3">Laboratorio</th>
                    <th class="py-3">Precio</th>
                    <th class="py-3">Stock</th>
                    <th class="py-3 text-center">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="med : ${medicamentos}">
                    <td th:text="${med.id}">1</td>
                    <td th:text="${med.nombre}">Acetaminofen</td>
                    <td th:text="${med.laboratorio != null ? med.laboratorio.nombre : 'Sin asignar'}">Genfar</td>
                    <td th:text="${'$' + med.precio}">$5000</td>
                    <td th:text="${med.stock}">50</td>
                    
                    <td class="text-center">
                        <a th:href="@{/medicamentos/editar/{id}(id=${med.id})}" class="btn btn-sm btn-pastel-edit me-2 px-3">Editar</a>
                        <a th:href="@{/medicamentos/eliminar/{id}(id=${med.id})}" class="btn btn-sm btn-pastel-delete px-3" onclick="return confirm('¿Estás seguro de eliminar este medicamento?');">Eliminar</a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(medicamentos)}">
                    <td colspan="6" class="text-center text-muted py-4">No se encontraron medicamentos registrados.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${paginaActual.totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${paginaActual.first} ? 'disabled'">
                <a class="page-link" th:href="@{/medicamentos(page=${paginaActual.number - 1}, keyword=${keyword})}">Anterior</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, paginaActual.totalPages - 1)}" th:classappend="${i == paginaActual.number} ? 'active'">
                <a class="page-link" th:href="@{/medicamentos(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${paginaActual.last} ? 'disabled'">
                <a class="page-link" th:href="@{/medicamentos(page=${paginaActual.number + 1}, keyword=${keyword})}">Siguiente</a>
            </li>
        </ul>
    </nav>

    <div class="mt-4">
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-pastel-logout">Cerrar Sesión</button>
        </form>
    </div>
    
</body>
</html>
